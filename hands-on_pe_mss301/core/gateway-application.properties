# ====================================================
# 1. CAU HINH CO BAN
# ====================================================
# Ten ung dung Gateway
spring.application.name=gateway-api
# Client gui request den Gateway qua cong 9999
server.port=9999

# ====================================================
# 2. DINH TUYEN API
# ====================================================
# User Service: giu nguyen duong dan /api/users/**
spring.cloud.gateway.server.webflux.routes[0].id=user-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:6969
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

# Order Service: giu nguyen duong dan /api/orders/**
spring.cloud.gateway.server.webflux.routes[1].id=order-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:6789
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/orders/**

# ====================================================
# 3. DINH TUYEN TAI LIEU SWAGGER
# ====================================================
# Swagger User: /users/v3/api-docs -> /v3/api-docs
# StripPrefix=1 bo phan dau tien (/users)
spring.cloud.gateway.server.webflux.routes[2].id=user-swagger-route
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:6969
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/users/v3/api-docs
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

# Swagger Order: /orders/v3/api-docs -> /v3/api-docs
spring.cloud.gateway.server.webflux.routes[3].id=order-swagger-route
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:6789
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/orders/v3/api-docs
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

# Swagger UI tap trung: http://localhost:9999/swagger-ui.html
springdoc.swagger-ui.enabled=true
# Danh sach service trong hop chon cua Swagger UI
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/users/v3/api-docs
springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/orders/v3/api-docs

# ====================================================
# 4. ACTUATOR - GIAM SAT GATEWAY
# ====================================================
# Can them spring-boot-starter-actuator trong pom.xml.
# Actuator cung cap cac endpoint de kiem tra ung dung.
# GET http://localhost:9999/actuator/health
#   Kiem tra Gateway dang hoat dong (UP/DOWN).
# GET http://localhost:9999/actuator/gateway/routes
#   Xem danh sach route Gateway da dang ky.
# GET http://localhost:9999/actuator/info
#   Xem thong tin ung dung (neu da khai bao thong tin).
# GET http://localhost:9999/actuator/metrics
#   Xem danh sach chi so giam sat.
# Mo cac endpoint tren qua HTTP (dung cho demo/local).
management.endpoints.web.exposure.include=gateway,health,info,metrics
# Chi cho phep doc Actuator Gateway; khong sua/xoa route.
management.endpoint.gateway.access=read-only

# ====================================================
# 5. LOG - HO TRO DEBUG
# ====================================================
# In thong tin dinh tuyen chi tiet khi thu nghiem.
logging.level.org.springframework.cloud.gateway=DEBUG
