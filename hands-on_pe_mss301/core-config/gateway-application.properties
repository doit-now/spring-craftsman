# ====================================================
# 1. CAU HINH CO BAN
# ====================================================
# Ten ung dung Gateway
spring.application.name=SE686868HotelGateway
# Client gui request den Gateway qua cong 8080
server.port=8080

# ====================================================
# 2. DINH TUYEN API
# ====================================================
# Room Service: giu nguyen duong dan /api/rooms/**
spring.cloud.gateway.server.webflux.routes[0].id=room-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/rooms/**

# Reservation Service: giu nguyen duong dan /api/reservations/**
spring.cloud.gateway.server.webflux.routes[1].id=reservation-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/reservations/**

# ====================================================
# 3. DINH TUYEN TAI LIEU SWAGGER
# ====================================================
# Swagger Room: /rooms/v3/api-docs -> /v3/api-docs
# StripPrefix=1 bo phan dau tien (/rooms)
spring.cloud.gateway.server.webflux.routes[2].id=room-swagger-route
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/rooms/v3/api-docs
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

# Swagger Reservation: /reservations/v3/api-docs -> /v3/api-docs
# StripPrefix=1 bo phan dau tien (/reservations)
spring.cloud.gateway.server.webflux.routes[3].id=reservation-swagger-route
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/reservations/v3/api-docs
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

# Swagger UI tap trung: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.enabled=true
# Danh sach service trong hop chon cua Swagger UI
springdoc.swagger-ui.urls[0].name=Room Service
springdoc.swagger-ui.urls[0].url=/rooms/v3/api-docs
springdoc.swagger-ui.urls[1].name=Reservation Service
springdoc.swagger-ui.urls[1].url=/reservations/v3/api-docs

# ====================================================
# 4. ACTUATOR - GIAM SAT GATEWAY
# ====================================================
# Can them spring-boot-starter-actuator trong pom.xml.
# Actuator cung cap cac endpoint de kiem tra ung dung.
# GET http://localhost:9999/actuator/health
#   Kiem tra Gateway dang hoat dong (UP/DOWN).
# GET http://localhost:9999/actuator/gateway/routes
#   Xem danh sach route Gateway da dang ky.
# GET http://localhost:9999/actuator/info
#   Xem thong tin ung dung (neu da khai bao thong tin).
# GET http://localhost:9999/actuator/metrics
#   Xem danh sach chi so giam sat.
# Mo cac endpoint tren qua HTTP (dung cho demo/local).
management.endpoints.web.exposure.include=gateway,health,info,metrics
# Chi cho phep doc Actuator Gateway; khong sua/xoa route.
management.endpoint.gateway.access=read-only

# ====================================================
# 5. LOG - HO TRO DEBUG
# ====================================================
# In thong tin dinh tuyen chi tiet khi thu nghiem.
logging.level.org.springframework.cloud.gateway=DEBUG


spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns=http://localhost:[*],http://127.0.0.1:[*]
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
