spring.application.name=SE686868ReservationService

server.port=8082

# Theo đề: dùng DB có sẵn, KHÔNG tự tạo / sửa bảng.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MSS301_2026_PE;encrypt=false
spring.datasource.username=sa
# Thay mật khẩu bằng biến môi trường, không commit mật khẩu thật.
spring.datasource.password=${DB_PASSWORD:sa123456}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Reservation -> Room qua Feign; không gọi repository của service khác.
room.service.url=http://localhost:8081
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=3000

# Cấu hình Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
